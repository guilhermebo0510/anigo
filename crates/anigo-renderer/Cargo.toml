[package]
name = "anigo-renderer"
version = "0.1.0"
edition = "2021"
description = "WebGPU (wgpu) rendering engine, shaders, and headless offscreen pipeline for ANIGO"

[dependencies]
anigo-core = { workspace = true }
wgpu = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }
pollster = { workspace = true }
image = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Mesma série do naga que o wgpu 30 embute: valida os .wgsl sem precisar de GPU.
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in"] }
