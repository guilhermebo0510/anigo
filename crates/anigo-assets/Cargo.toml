[package]
name = "anigo-assets"
version = "0.1.0"
edition = "2021"
publish = false
description = "ANIGO: backend da Biblioteca de ativos (registry SQLite + FTS5, import em background, material toon canonico, cache de miniaturas). Sem UI e sem GPU."

[features]
default = ["fbx", "watch"]
# Analise de FBX via ufbx (crates/anigo-native, C vendorizado). Sem a feature, FBX e importado como arquivo opaco.
fbx = ["dep:anigo-native"]
# Watcher de pastas ligadas (notify). Sem a feature, `Library::watch` retorna `AssetError::Unsupported`.
watch = ["dep:notify"]

[dependencies]
anigo-core = { workspace = true }
anigo-vrm = { workspace = true }
anigo-native = { path = "../anigo-native", default-features = false, features = ["ufbx"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
image = { workspace = true }
base64 = { workspace = true }
rusqlite = { version = "0.40", features = ["bundled"] }
blake3 = "1.8"
walkdir = "2.5"
crossbeam-channel = "0.5"
rayon = "1.10"
uuid = { version = "1", features = ["v7"] }
lru = "0.18"
fast_image_resize = "6"
notify = { version = "8", optional = true }

[dev-dependencies]
tempfile = "3"
