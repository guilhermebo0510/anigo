[workspace]
members = [
    "crates/anigo-core",
    "crates/anigo-renderer",
    "crates/anigo-mcp",
    "crates/anigo-ik",
    "crates/anigo-hair",
    "crates/anigo-cloth",
    "crates/anigo-vrm",
    "crates/anigo-ai",
    "src-tauri",
]
resolver = "2"

[workspace.dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
bytemuck = { version = "1.21", features = ["derive"] }
pollster = "0.4"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
wgpu = "24"
anigo-core = { path = "crates/anigo-core" }
anigo-renderer = { path = "crates/anigo-renderer" }
