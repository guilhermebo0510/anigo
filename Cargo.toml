[workspace]
members = [
    "crates/anigo-core",
    "crates/anigo-session",
    "crates/anigo-bridge",
    "crates/anigo-modeling",
    "crates/anigo-studio",
    "crates/anigo-native",
    "crates/anigo-renderer",
    "crates/anigo-mcp",
    "crates/anigo-ik",
    "crates/anigo-hair",
    "crates/anigo-cloth",
    "crates/anigo-physics",
    "crates/anigo-vrm",
    "crates/anigo-ai",
    "crates/anigo-assets",
    "crates/anigo-charbase",
    "src-tauri",
]
resolver = "2"

[workspace.dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
bytemuck = { version = "1.21", features = ["derive"] }
pollster = "0.4"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
wgpu = "30.0.1"
anigo-core = { path = "crates/anigo-core" }
anigo-renderer = { path = "crates/anigo-renderer" }
anigo-vrm = { path = "crates/anigo-vrm" }
anigo-physics = { path = "crates/anigo-physics" }

# Perfil de desenvolvimento: o app é interativo (egui + wgpu), então as DEPENDÊNCIAS (egui, wgpu, naga, image, glam…) são
# compiladas otimizadas mesmo no `cargo run` comum — sem isto a interface e o arrasto de objetos rodavam a ~6 FPS (tudo em
# opt-level 0). O código do próprio ANIGO fica em opt-level 1 (compila rápido e já é bem mais rápido que 0).
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
