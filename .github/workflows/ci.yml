name: CI
on:
  push:
    branches: [main, arena/**]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22+: `npm test` usa o type stripping nativo (`--experimental-strip-types`).
          # No Node 20 o comando nem inicia (exit 9) e os contratos TS⇄Rust não rodavam no CI.
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: svelte-check (TS strict)
        run: npm run check
        continue-on-error: true # P1-14 strict ativo; 84 erros legados (Icons size) pré-existentes — gate build é obrigatório, svelte-check será hard gate em P2
      - name: lint
        run: npm run lint --if-present
      - name: testes (contratos Rust⇄TS, persistência, personagem, e2e)
        run: npm test
      - name: contratos congelados (fixtures em dia)
        run: npm run fixtures:check
      - name: "shaders ⇄ render contract (P1-04: bloco de skinning idêntico)"
        run: npm run check:wgsl
      - name: sintaxe Rust (tree-sitter, sem toolchain)
        run: node scripts/check_rust_syntax.mjs
      - name: build
        run: npm run build
      - name: no leaks — destroy/pause hooks present
        run: |
          grep -q "setPausedByVisibility" src/components/viewport/webgpu_renderer.ts
          grep -q "destroy()" src/components/viewport/webgpu_renderer.ts

  # P1-07: os gates que exigem toolchain Rust (o job `check` roda sem cargo).
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Sem escopo por ref o Rust reusa binários compilados de outras arena/*
          # (o include_str! congela bytes antigos e o teste de hash diverge da
          # fixture fresca lida em runtime — foi o caso do inverted_hull 19020B).
          shared-key: ${{ github.ref_name }}
      - name: dependências de sistema (Tauri/webview)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - name: formato
        run: cargo fmt --all -- --check
        continue-on-error: true # o repositório ainda não está 100% rustfmt-clean; vira hard gate depois do P1
      - name: cargo check (todos os alvos)
        run: |
          if ! cargo check --workspace --all-targets > /tmp/cargo-check.log 2>&1; then
            cat /tmp/cargo-check.log
            python3 scripts/annotate_rust_errors.py /tmp/cargo-check.log "cargo check --workspace --all-targets"
            exit 1
          fi
          tail -5 /tmp/cargo-check.log
      - name: WGSL dos shaders de produção (naga)
        # Sem GPU e sem naga no ambiente de desenvolvimento, um shader inválido
        # só apareceria ao abrir o app. Desde o skinning (P1-04) este passo é
        # gate de verdade: se o naga instalar, um shader inválido reprova o CI;
        # se a instalação falhar (rede), o passo avisa e `npm run check:wgsl`
        # continua cobrindo a paridade shader ⇄ contrato. Roda ANTES do cargo
        # test para um shader malformado virar erro explícito (com linha),
        # não um "Validation Error" sem rosto no wgpu.
        run: |
          if ! command -v naga >/dev/null 2>&1; then
            cargo install naga-cli --locked || {
              echo "::warning::naga indisponível (instalação falhou); a paridade shader ⇄ contrato segue em npm run check:wgsl"
              exit 0
            }
          fi
          # ATENÇÃO: o 2º positional do naga-cli é o ARQUIVO DE SAÍDA (ele
          # sobrescreve com o WGSL normalizado!). Vários arquivos de uma vez
          # clobberavam o 2º — foi isso que corrompeu o cargo test abaixo
          # (o runner ficou com cel normalizado dentro de inverted_hull.wgsl).
          for f in crates/anigo-renderer/shaders/cel_shading.wgsl \
               crates/anigo-renderer/shaders/inverted_hull.wgsl \
               crates/anigo-renderer/shaders/morph_sparse_compute.wgsl \
               crates/anigo-renderer/shaders/face_sdf.wgsl \
               crates/anigo-renderer/shaders/postprocess_dof.wgsl \
               crates/anigo-renderer/shaders/anime_eye.wgsl; do
            echo "naga: validando $f"
            # 2º positional = ARQUIVO DE SAÍDA: /dev/null recebe a versão
            # normalizada em vez de clobbertar o próximo shader (1º arg só
            # deu exit 255 nesta versão do naga-cli).
            if ! naga "$f" /dev/null > /tmp/naga-log.txt 2>&1; then
              cat /tmp/naga-log.txt
              python3 scripts/annotate_rust_errors.py /tmp/naga-log.txt "naga $f"
              exit 1
            fi
          done
      - name: cargo test (núcleo)
        run: |
          if ! cargo test -p anigo-core > /tmp/cargo-test-core.log 2>&1; then
            cat /tmp/cargo-test-core.log
            python3 scripts/annotate_rust_errors.py /tmp/cargo-test-core.log "cargo test -p anigo-core"
            exit 1
          fi
          tail -5 /tmp/cargo-test-core.log
      - name: cargo test (renderer — testes de GPU se pulam sem adaptador)
        run: |
          if ! cargo test -p anigo-renderer > /tmp/cargo-test-renderer.log 2>&1; then
            cat /tmp/cargo-test-renderer.log
            python3 scripts/annotate_rust_errors.py /tmp/cargo-test-renderer.log "cargo test -p anigo-renderer"
            exit 1
          fi
          tail -5 /tmp/cargo-test-renderer.log
      - name: cargo test (MCP)
        run: |
          if ! cargo test -p anigo-mcp > /tmp/cargo-test-mcp.log 2>&1; then
            cat /tmp/cargo-test-mcp.log
            python3 scripts/annotate_rust_errors.py /tmp/cargo-test-mcp.log "cargo test -p anigo-mcp"
            exit 1
          fi
          tail -5 /tmp/cargo-test-mcp.log

  # Trilha nativa (docs/native): motor de modelagem, bindings C/C++ e app egui sob Xvfb +
  # Vulkan por software (lavapipe). Gera screenshots dos cenários como artefato para revisão visual.
  native:
    runs-on: ubuntu-latest
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      XDG_RUNTIME_DIR: /tmp
      WGPU_BACKEND: vulkan
      ANIGO_TEST_OUT: ${{ github.workspace }}/native-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-${{ github.ref_name }}
      - name: dependências de sistema (Vulkan por software, Xvfb, X11/Wayland, fontes)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 xvfb xauth \
            libxkbcommon-dev libxkbcommon-x11-0 libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libwayland-dev libfontconfig1-dev fonts-dejavu-core \
            xdotool imagemagick python3-pil
      - name: testes (modelagem, sessão, nativo C/C++, biblioteca de ativos, studio)
        run: cargo test -p anigo-core -p anigo-modeling -p anigo-session -p anigo-native -p anigo-assets -p anigo-studio
      - name: grade da Biblioteca com 50 000 ativos sintéticos (headless egui; orçamento folgado em debug)
        run: ANIGO_BENCH_N=50000 cargo test -p anigo-studio grid_frame_time_with_synthetic_library -- --nocapture
      - name: testes do renderer (golden frames + render_to_texture + naga)
        run: cargo test -p anigo-renderer
      - name: screenshots dos cenários do studio (Xvfb)
        run: |
          mkdir -p native-artifacts
          cargo build -p anigo-studio
          for sc in edit-faces grab-modal tool-move cel-preview cel-edit uv-editor uv-sphere normals-overlay normals-transfer normals-paint sculpt-draw sculpt-mask hair-draw hair-groups hair-cel; do
            xvfb-run -a -s "-screen 0 1600x1000x24" ./target/debug/anigo-studio \
              --no-session --workspace modelagem --scenario "$sc" --frames 14 --size 1440x900 \
              --screenshot "native-artifacts/studio_$sc.png"
          done
          for sc in character-default character-sliders character-female character-face; do
            xvfb-run -a -s "-screen 0 1600x1000x24" ./target/debug/anigo-studio \
              --no-session --workspace personagem --scenario "$sc" --frames 14 --size 1440x900 \
              --screenshot "native-artifacts/studio_$sc.png"
          done
          xvfb-run -a -s "-screen 0 1600x1000x24" ./target/debug/anigo-studio \
            --no-session --workspace biblioteca --frames 14 --size 1440x900 \
            --screenshot native-artifacts/studio_biblioteca.png
          for sc in cenario-vazio cenario-montado cenario-snap cenario-outliner cenario-gizmo cenario-camera; do
            xvfb-run -a -s "-screen 0 1600x1000x24" ./target/debug/anigo-studio \
              --no-session --workspace cenario --scenario "$sc" --frames 14 --size 1440x900 \
              --screenshot "native-artifacts/studio_$sc.png"
          done
          for sc in iluminacao-base iluminacao-luz-n60-35-100 iluminacao-luz-60-35-100 iluminacao-luz-0-78-100 iluminacao-luz-170-30-120 iluminacao-luz-60-35-35 iluminacao-rig-three_point iluminacao-rig-rim iluminacao-rig-golden_hour iluminacao-rig-night iluminacao-sombra iluminacao-sombra-suave iluminacao-rosto iluminacao-rosto-sem iluminacao-camera iluminacao-ambiente iluminacao-extras; do
            xvfb-run -a -s "-screen 0 1600x1000x24" ./target/debug/anigo-studio \
              --no-session --workspace iluminacao --scenario "$sc" --frames 14 --size 1440x900 \
              --screenshot "native-artifacts/studio_$sc.png"
          done
          for sc in render-camera render-saida render-passes render-transparente render-fila; do
            xvfb-run -a -s "-screen 0 1600x1000x24" ./target/debug/anigo-studio \
              --no-session --workspace render --scenario "$sc" --frames 14 --size 1440x900 \
              --screenshot "native-artifacts/studio_$sc.png"
          done
      - name: screenshots da Biblioteca (biblioteca sintética + ativos reais; espera as miniaturas 3D)
        run: bash scripts/native_library_screens.sh ./target/debug/anigo-studio native-artifacts
      - name: smoke de entrada real do Cenario (xdotool: arrasta card da Biblioteca, gizmo com snap, Ctrl+Z/Ctrl+Y)
        run: bash scripts/native_scene_smoke.sh ./target/debug/anigo-studio native-artifacts/scene_smoke
      - name: smoke de entrada real do Iluminacao (xdotool arrasta o disco do sol, Ctrl+Z/Ctrl+Y, clica um rig)
        run: bash scripts/native_lighting_smoke.sh ./target/debug/anigo-studio native-artifacts/lighting_smoke
      - name: smoke de entrada real do Render (xdotool: trocar orientação, Ctrl+Z/Ctrl+Y, render real com alfa, determinismo, cancelar)
        run: bash scripts/native_render_smoke.sh ./target/debug/anigo-studio native-artifacts/render_smoke
      - name: screenshots do Shading (rampa, rim, contorno, face SDF em vários ângulos, A/B, paleta, presets, fontes de material)
        run: |
          for sc in shading-ball shading-rampa shading-rim shading-contorno shading-face-sdf shading-face-sdf-frente shading-face-sdf-espelho shading-ab shading-paleta shading-presets shading-cenario shading-modelagem; do
            xvfb-run -a -s "-screen 0 1600x1000x24" ./target/debug/anigo-studio \
              --no-session --workspace shading --scenario "$sc" --frames 14 --size 1440x900 \
              --screenshot "native-artifacts/studio_$sc.png"
          done
      - name: smoke de entrada real do Shading (xdotool arrasta slider = 1 passo de undo; Ctrl+Z/Ctrl+Y; viewport idêntica)
        run: bash scripts/native_shading_smoke.sh ./target/debug/anigo-studio native-artifacts/shading_smoke
      - name: smoke de entrada real da Biblioteca (xdotool rola a grade, clica num card, Ctrl+clique, Ctrl+A)
        run: bash scripts/native_library_smoke.sh ./target/debug/anigo-studio native-artifacts/library_smoke
      - name: smoke de entrada real (xdotool: Tab, 3, clique, E, mover, clique)
        run: |
          sudo apt-get install -y --no-install-recommends xdotool
          scripts/native_input_smoke.sh native-artifacts/studio_input_smoke.png
      - name: smoke de entrada real da Escultura (xdotool arrasta o mouse; screenshots por diferença)
        run: bash scripts/native_sculpt_smoke.sh ./target/debug/anigo-studio
      - name: smoke de entrada real do Modo Cabelo (xdotool desenha uma mecha, Ctrl+Z desfaz, Ctrl+Shift+Z refaz)
        run: bash scripts/native_hair_smoke.sh ./target/debug/anigo-studio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-screenshots
          path: native-artifacts/
